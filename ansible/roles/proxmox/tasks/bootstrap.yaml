---
- name: Remove enterprise repos
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/pve-enterprise.sources
    - /etc/apt/sources.list.d/ceph.sources

- name: Write community repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: Update and upgrade packages
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist

- name: Install nfs-kernel-server
  ansible.builtin.apt:
    pkg:
      - nfs-kernel-server

- name: Check if ZFS pool exists
  register: zpool_existence
  ansible.builtin.command: zpool list music-pool
  changed_when: false
  failed_when: false

- name: Add ZFS pool if not exists
  ansible.builtin.command: zpool create -o ashift=12 -O compression=lz4 music-pool /dev/disk/by-id/ata-ST2000DM008-2UB102_WFL5S98Z
  when: zpool_existence.rc != 0

- name: Check if music dataset exists
  ansible.builtin.command: zfs list music-pool/music
  register: music_dataset
  changed_when: false
  failed_when: false

- name: Create music dataset if not exists
  ansible.builtin.command: zfs create music-pool/music
  when: music_dataset.rc != 0

- name: Set music-pool/music permissions
  ansible.builtin.file:
    state: directory
    path: /music-pool/music
    owner: "1001"
    group: "1001"
    mode: "2775"

- name: Create export-builder store directories owned by app UID
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1001"
    group: "1001"
    mode: "2775"
  loop:
    - /music-pool/music/raw
    - /music-pool/music/artifacts
    - /music-pool/music/staging

- name: Configure NFS export for music dataset
  ansible.builtin.blockinfile:
    path: /etc/exports
    create: true
    marker: "# {mark} ANSIBLE MANAGED music-pool/music"
    block: |
      /music-pool/music 192.168.0.192/26(rw,sync,no_subtree_check,root_squash)
  notify: reload nfs exports

- name: Disable ZFS native NFS share (we manage /etc/exports)
  ansible.builtin.command: zfs set sharenfs=off music-pool/music
  changed_when: false

- name: Install sanoid for backups
  ansible.builtin.apt:
    pkg:
      - sanoid

- name: Ensure sanoid config dir exists
  ansible.builtin.file:
    path: /etc/sanoid
    state: directory
    mode: "0644"

- name: Write sanoid config
  ansible.builtin.copy:
    dest: /etc/sanoid/sanoid.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [music-pool/music]
        use_template = production
        recursive = yes

      #############################
      # templates below this line #
      #############################

      [template_production]
              frequently = 0
              hourly = 0
              daily = 7
              weekly = 4
              monthly = 3
              yearly = 0
              autosnap = yes
              autoprune = yes

- name: Ensure sanoid timer is started and enabled
  become: true
  ansible.builtin.systemd:
    name: sanoid.timer
    state: started
    enabled: true
    daemon_reload: true
