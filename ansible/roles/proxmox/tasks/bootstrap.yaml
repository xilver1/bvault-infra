---
- name: Remove enterprise repos
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/pve-enterprise.sources
    - /etc/apt/sources.list.d/ceph.sources

- name: Write community repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: trixie
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: Update and upgrade packages
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist

- name: Check if ZFS pool exists
  register: zpool_existence
  ansible.builtin.command: zpool list music-pool 
  changed_when: false
  failed_when: false

- name: Add ZFS pool if not exists
  ansible.builtin.command: zpool create -o ashift=12 -O compression=lz4 music-pool /dev/disk/by-id/ata-ST2000DM008-2UB102_WFL5S98Z
  when: zpool_existence.rc != 0 