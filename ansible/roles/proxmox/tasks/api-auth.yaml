---
# This is done through shell because proxmox native modules require API token to exist already. Precisely what we are trying to accomplish

- name: Check whether Terraform role exists
  ansible.builtin.command: pveum role list --output-format json
  register: pve_roles
  changed_when: false

- name: Create Terraform role
  ansible.builtin.command: >
    pveum role add Terraform --privs "{{ terraform_privs | join(',') }}"
  when: "'Terraform' not in (pve_roles.stdout | from_json | map(attribute='roleid') | list)"

- name: Check whether Terraform user exists
  ansible.builtin.command: pveum user list --output-format json
  register: pve_users
  changed_when: false

- name: Create Terraform user
  ansible.builtin.command: >
    pveum user add {{ users['prox_terraform_user'] }}
    --comment "Terraform integration user"
    --enable 1
    --expire 0
  when: prox_terraform_user not in (pve_users.stdout | from_json | map(attribute='userid') | list)

- name: Grant Terraform role on /vms
  ansible.builtin.command: >
    pveum acl modify /vms
    --users {{ users['prox_terraform_user'] }}
    --roles Terraform
    --propagate 1
  changed_when: false
    

- name: Check whether Terraform API token exists
  ansible.builtin.command: >
    pveum user token list {{ users['prox_terraform_user'] }} --output-format json
  register: pve_tokens
  changed_when: false

- name: Create Terraform API token
  ansible.builtin.command: >
    pveum user token add {{ users['prox_terraform_user'] }} {{ users['prox_terraform_token_id'] }}
    --comment "Terraform integration"
    --expire 0
    --privsep 0
    --output-format json
  register: api_token
  no_log: true
  when: prox_terraform_token_id not in (pve_tokens.stdout | from_json | map(attribute='tokenid') | list)

- name: Store generated API_TOKEN as parameter in AWS SSM parameter store
  no_log: true
  delegate_to: localhost
  when: api_token is changed
  community.aws.ssm_parameter:
    name: /lab/compute/api-token
    string_type: SecureString
    value: "{{ (api_token.stdout | from_json).value }}"
    region: us-east-1

- name: Rotate API_token
  shell: pveum user token modify "{{ users['prox_terraform_user'] }}" "{{ users['prox_terraform_token_id'] }}" --regenerate 1 --output-format json
  no_log: true
  register: token_rotated
  tags: [rotate, never]

- name: Store rotated API_TOKEN as parameter in AWS SSM parameter store
  no_log: true
  delegate_to: localhost
  tags: [rotate, never]
  community.aws.ssm_parameter:
    name: /lab/compute/api-token
    string_type: SecureString
    value: "{{ (token_rotated.stdout | from_json).value }}"
    region: us-east-1