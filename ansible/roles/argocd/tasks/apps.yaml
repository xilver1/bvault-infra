---
- name: Create ArgoCD project
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: bvault-project
        namespace: argocd
      spec:
        description: "Prod of rekord-export app"
        sourceRepos:
          - https://github.com/xilver1/bvault-manifests.git
        destinations:
          - namespace: bvault-prod
            server: https://kubernetes.default.svc
          - namespace: argocd
            server: https://kubernetes.default.svc
        clusterResourceWhitelist:
          - group: ''
            kind: Namespace


- name: Create ArgoCD root app
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: root-app
        namespace: argocd
      spec:
        project: bvault-project
        source:
          repoURL: https://github.com/xilver1/bvault-manifests.git
          targetRevision: main
          path: apps
        destination:
          server: https://kubernetes.default.svc
          namespace: argocd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true