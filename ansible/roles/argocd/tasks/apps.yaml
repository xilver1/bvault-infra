---
- name: Create ArgoCD project
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: bvault-project
        namespace: argocd
      spec:
        description: "Prod of bvault app"
        sourceRepos:
          - https://github.com/xilver1/bvault-manifests.git
          - https://charts.external-secrets.io
          - https://github.com/external-secrets/external-secrets.git
          - https://charts.longhorn.io
        destinations:
          - namespace: bvault-prod
            server: https://kubernetes.default.svc
          - namespace: argocd
            server: https://kubernetes.default.svc
          - namespace: longhorn-system
            server: https://kubernetes.default.svc
        clusterResourceWhitelist:
          - group: ""
            kind: Namespace
          - group: apiextensions.k8s.io
            kind: CustomResourceDefinition
          - group: rbac.authorization.k8s.io
            kind: ClusterRole
          - group: rbac.authorization.k8s.io
            kind: ClusterRoleBinding
          - group: storage.k8s.io
            kind: StorageClass
          - group: admissionregistration.k8s.io
            kind: ValidatingWebhookConfiguration
          - group: admissionregistration.k8s.io
            kind: MutatingWebhookConfiguration
          - group: external-secrets.io
            kind: ClusterSecretStore
          - group: ""
            kind: PersistentVolume
          - group: storage.k8s.io
            kind: CSIDriver
          - group: storage.k8s.io
            kind: CSINode

- name: Create ArgoCD root app
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: root-app
        namespace: argocd
      spec:
        project: bvault-project
        source:
          repoURL: https://github.com/xilver1/bvault-manifests.git
          targetRevision: main
          path: apps
          directory:
            recurse: true
        destination:
          server: https://kubernetes.default.svc
          namespace: argocd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
