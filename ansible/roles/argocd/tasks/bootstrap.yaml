- name: Create ArgoCD namespace
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd

- name: Download ArgoCD manifest to the cluster.
  delegate_to: localhost
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/core-install.yaml"
    dest: ~/core-install.yaml
    mode: '0664'

- name: Install ArgoCD
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    src: "~/core-install.yaml"
    namespace: argocd
    server_side_apply:
      field_manager: "argocd-installer"
      force_conflicts: true

- name: Wait for ArgoCD server to be ready
  delegate_to: localhost
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: argocd
    name: argocd-repo-server
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Available
      status: "True"

- name: Download ArgoCD CLI
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/argoproj/argo-cd/releases/download/{{ argocd_version }}/argocd-linux-amd64"
    dest: /usr/local/bin/argocd
    mode: '0775'
    force: no