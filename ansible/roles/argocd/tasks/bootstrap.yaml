- name: Create ArgoCD namespace
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd

- name: Download ArgoCD manifest to the cluster.
  delegate_to: localhost
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/core-install.yaml"
    dest: ~/core-install.yaml
    mode: '0664'

- name: Install ArgoCD
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    src: "~/core-install.yaml"
    namespace: argocd
    server_side_apply:
      field_manager: "argocd-installer"
      force_conflicts: true

- name: Wait for ArgoCD server to be ready
  delegate_to: localhost
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: argocd
    name: argocd-repo-server
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Available
      status: "True"

- name: Read current argocd-secret
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: argocd-secret
    namespace: argocd
  register: current_argocd_secret

- name: Path secret with fresh timestamp
  no_log: true
  kubernetes.core.k8s:
      state: present
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          namespace: argocd
          name: argocd-secret
        stringData:
          admin.password: "{{ lookup('amazon.aws.aws_ssm', '/lab/compute/argocd-secret-hash') }}"
          admin.passwordMtime: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
  when: >
    {{ current_argocd_secret.resources[0].data | default({})['admin.password'] | default('') | b64decode
     != lookup('amazon.aws.aws_ssm', '/lab/compute/argocd-secret-hash') }}