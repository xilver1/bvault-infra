- name: Create ArgoCD namespace
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd


- name: Download ArgoCD manifest to the cluster.
  delegate_to: localhosts
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/core-install.yaml"
    dest: ~/core-install.yaml
    mode: '0664'

- name: Install ArgoCD
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    src: "~/core-install.yaml"
    namespace: argocd
    server_side_apply:
      field_manager: "argocd-installer"
      force_conflicts: true

- name: Wait for ArgoCD server to be ready
  delegate_to: localhost
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: argocd
    name: argocd-server
    wait: true
    wait_timeout: 300
    wait_condition:
      type: Available
      status: "True"

- name: Get initial admin password
  no_log: true
  delegate_to: localhost
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: argocd
    name: argocd-initial-admin-secret
  register: argocd_secret

- name: Store generated/regenerated admin password as parameter in AWS SSM parameter store
  no_log: true
  delegate_to: localhost
  community.aws.ssm_parameter:
    name: /lab/compute/argocd-secret
    string_type: SecureString
    value: "{{ argocd_secret.resources[0].data.password | b64decode }}"
    region: us-east-1