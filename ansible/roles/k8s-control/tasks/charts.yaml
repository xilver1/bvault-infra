---
- name: Add Tigera repo
  delegate_to: localhost
  kubernetes.core.helm_repository:
    name: projectcalico
    repo_url: https://docs.tigera.io/calico/charts

- name: Install Calico CRDs
  delegate_to: localhost
  ansible.builtin.shell: >
    helm template calico-crds projectcalico/crd.projectcalico.org.v1 --version v3.32.1
    | kubectl apply --server-side -f -
  changed_when: false

- name: Install tigera-operator chart
  delegate_to: localhost
  kubernetes.core.helm:
    name: calico
    chart_ref: projectcalico/tigera-operator
    chart_version: v3.32.1
    release_namespace: tigera-operator
    create_namespace: true
    values:
      installation:
        calicoNetwork:
          ipPools:
            - cidr: "{{ pod_cidr }}"
              encapsulation: VXLAN

- name: Label worker node as storage node for Longhorn
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ item }}"
        labels:
          storage-node: "true"
  loop: "{{ groups['workers'] }}"
