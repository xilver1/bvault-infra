- name: Add Helm repositories
  delegate_to: localhost
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
  loop:
    - {
        name: "prometheus-community",
        url: "https://prometheus-community.github.io/helm-charts",
      }
    - { name: "grafana", url: "https://grafana.github.io/helm-charts" }

- name: Create monitoring namespace
  delegate_to: localhost
  kubernetes.core.k8s:
    name: monitoring
    kind: Namespace
    state: present

- name: Deploy Prometheus Agent (Pushes metrics out)
  delegate_to: localhost
  kubernetes.core.helm:
    name: prometheus-agent
    chart_ref: prometheus-community/prometheus
    release_namespace: monitoring
    values:
      # We disable alertmanager and pushgateway because we only want the agent
      alertmanager: { enabled: false }
      prometheus-pushgateway: { enabled: false }
      # Prevent crash loop in agent mode by removing rule_files which are invalid
      serverFiles:
        prometheus.yml:
          rule_files: []
      # The agent mode strictly collects and forwards metrics
      server:
        defaultFlagsOverride:
          - --agent
          - --config.file=/etc/config/prometheus.yml
          - --storage.agent.path=/data
        remoteWrite:
          - url: "http://{{ hostvars['observability']['ansible_host'] }}:9090/api/v1/write"

- name: Deploy Grafana Alloy (Logs)
  delegate_to: localhost
  kubernetes.core.helm:
    name: grafana-alloy
    chart_ref: grafana/alloy
    release_namespace: monitoring
    values:
      # Runs Alloy on every node (just like a DaemonSet) to grab all system logs
      alloy:
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
        extraEnv:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        mounts:
          varlog: true
        # The configuration script (Alloy syntax) telling it to look for K8s logs and send them to Loki
        configMap:
          create: true
          content: |
            // Discover pods running ONLY on this specific node
            discovery.kubernetes "pods" {
              role = "pod"
              selectors {
                role  = "pod"
                field = "spec.nodeName=" + sys.env("NODE_NAME")
              }
            }

            // Relabel to extract K8s metadata and synthesize the log file path
            discovery.relabel "pod_logs" {
              targets = discovery.kubernetes.pods.targets

              rule {
                source_labels = ["__meta_kubernetes_namespace"]
                target_label  = "namespace"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_name"]
                target_label  = "pod"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_container_name"]
                target_label  = "container"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                target_label  = "app"
              }
              
              // Synthesize the actual file path on disk
              rule {
                source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                separator     = "_"
                regex         = "([^_]+)_([^_]+)_([^_]+)_([^_]+)"
                replacement   = "/var/log/pods/$1_$2_$3/$4/*.log"
                target_label  = "__path__"
              }
            }

            // Read the files identified by the relabeled targets
            loki.source.file "pod_logs" {
              targets    = discovery.relabel.pod_logs.output
              forward_to = [loki.write.endpoint.receiver]
            }

            loki.write "endpoint" {
              endpoint {
                url = "http://{{ hostvars['observability']['ansible_host'] }}:3100/loki/api/v1/push"
              }
            }
      # This allows Grafana Alloy to run on your Control Plane nodes
      controller:
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
