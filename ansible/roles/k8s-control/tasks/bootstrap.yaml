---
- name: Initialize cluster
  become: true
  ansible.builtin.command: >
    kubeadm init --pod-network-cidr {{ pod_cidr }}
    --control-plane-endpoint {{ k8s_cluster_virtual_ip }}:8443
  args:
    creates: /etc/kubernetes/admin.conf

- name: Copy credentials to runner
  become: true
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: yes

- name: Ensure .kube dir exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    mode: "0755"

- name: Copy credentials to node
  become: true
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    owner: root
    group: root
    mode: "0644"
    remote_src: true

- name: Generate worker join command
  become: true
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Create cert-manager namespace
  delegate_to: localhost
  kubernetes.core.k8s:
    name: cert-manager
    api_version: v1
    kind: Namespace
    state: present

- name: Create intermediate CA key secret
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    definition: 
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/tls             
      metadata:
        name: ca-key-intermediate
        namespace: cert-manager    
      stringData:
        tls.crt: "{{ lookup('amazon.aws.aws_ssm', '/lab/compute/intermediate-ca-cert' ) }}"
        tls.key: "{{ lookup('amazon.aws.aws_ssm', '/lab/compute/intermediate-ca-key' ) }}"