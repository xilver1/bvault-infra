---
- name: Initialize cluster
  become: true
  ansible.builtin.command: >
    kubeadm init --pod-network-cidr {{ pod_cidr }}
    --control-plane-endpoint {{ k8s_cluster_virtual_ip }}:8443
  args:
    creates: /etc/kubernetes/admin.conf

- name: Copy credentials to runner
  become: true
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: yes

- name: Ensure .kube dir exists
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    mode: "0755"

- name: Copy credentials to node
  become: true
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
    remote_src: true

- name: Generate worker join command
  become: true
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Create ESO secrets namespace
  delegate_to: localhost
  kubernetes.core.k8s:
    name: external-secrets
    api_version: v1
    kind: Namespace
    state: present

- name: Create AWS secret bundle for ESO
  no_log: true
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    definition: 
      apiVersion: v1
      kind: Secret
      type: Opaque        
      metadata:
        name: iamra-secret-bundle
        namespace: external-secrets    
      stringData:
        leaf-key: "{{ lookup('amazon.aws.aws_ssm', '/lab/compute/leaf-key' ) }}"
        leaf-cert: "{{ lookup('amazon.aws.aws_ssm', '/lab/compute/leaf-cert' ) }}"
        intermediate-ca-cert: "{{ lookup('amazon.aws.aws_ssm', '/lab/compute/intermediate-ca-cert' ) }}"