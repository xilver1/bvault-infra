---
- name: Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: grafana
    mode: "0755"
  loop:
    - "{{ tempo_dir_conf }}"
    - "{{ tempo_dir_data }}"

- name: Download and unpack Tempo binary
  ansible.builtin.unarchive:
    src: "https://github.com/grafana/tempo/releases/download/v{{ tempo_version }}/tempo_{{ tempo_version }}_linux_amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/tempo_{{ tempo_version }}_linux_amd64"

- name: Copy binaries to final destination
  ansible.builtin.copy:
    src: "/tmp/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: grafana
    mode: "0755"
  loop:
    - tempo
    - tempo-cli
    - tempo-query

- name: Copy Tempo's monolithic config
  ansible.builtin.template:
    src: templates/tempo.yml.j2
    dest: "{{ tempo_dir_conf }}/tempo.yml"
    owner: root
    group: grafana
    mode: "0644"
  notify: restart tempo

- name: Create the systemd service file for tempo
  ansible.builtin.copy:
    dest: /etc/systemd/system/tempo.service
    owner: root
    group: grafana
    mode: "0644"
    content: |
      [Unit]
      Description=Grafana Tempo Monolithic Tracing Engine
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=root
      Group=grafana
      Type=simple
      ExecStart=/usr/local/bin/tempo -config.file={{ tempo_dir_conf }}/tempo.yml -target=all
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: restart tempo

- name: Make sure Tempo's service is up and enabled
  ansible.builtin.systemd:
    name: tempo
    enabled: true
    state: started
    daemon_reload: true

# Handlers normally run at the very end of the play, which would leave the check
# below testing the *old* process. Force any pending restart to happen first.
- name: Apply any pending Tempo restart before checking it
  ansible.builtin.meta: flush_handlers

- name: Wait for Tempo to accept connections
  # Tempo parses its config strictly and exits on an unknown field, and systemd
  # then restarts it forever. Without this the play reports success while Tempo
  # crash-loops, and the first sign of trouble is Grafana Explore returning
  # "connection refused" -- possibly days later.
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 3200
    timeout: 60
    msg: >-
      Tempo is not listening on 3200. Check `journalctl -u tempo`; a config
      parse error is the usual cause.
