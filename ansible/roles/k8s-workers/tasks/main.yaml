---
- name: Install prerequisite packages for kubernetes
  become: true
  ansible.builtin.apt:
    pkg:
      - open-iscsi
      - nfs-common

- name: Ensure iscsid service is started and enabled
  become: true
  ansible.builtin.service:
    name: iscsid
    state: started
    enabled: true

- name: Join workers to cluster
  become: true
  ansible.builtin.command: "{{ hostvars[groups['control_plane'][0]]['join_command']['stdout'] }}"
  args:
    creates: /etc/kubernetes/kubelet.conf

- name: Label worker node as storage node for Longhorn
  become: true
  delegate_to: localhost
  kubernetes.core.k8s:
    state: present
    kubeconfig: /etc/kubernetes/admin.conf
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ inventory_hostname }}"
        labels:
          storage-node: "true"
