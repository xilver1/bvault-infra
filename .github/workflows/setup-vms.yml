name: Setup kubernetes cluster
on: workflow_dispatch

defaults:
  run:
    shell: bash
    working-directory: ./terraform

permissions:
  id-token: write
  contents: read

jobs:
  deploy-vms:
    name: Deploy VMs to compute servers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11"

      - name: Obtain temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::854469103070:role/lab-infra-terraform
          aws-region: us-east-1

      - name: Load CI OAuth creds from SSM to access Tailnet
        run: |
          ID=$(aws ssm get-parameter --name /lab/tailscale/ci-oauth-client-id --query Parameter.Value --output text)
          SECRET=$(aws ssm get-parameter --name /lab/tailscale/ci-oauth-client-secret --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$SECRET"
          echo "CI_OAUTH_ID=$ID" >> "$GITHUB_ENV"
          echo "CI_OAUTH_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Retrieve and load pre-generated SSH private key 
        run: |
          mkdir -p ~/.ssh && chmod 0700 ~/.ssh
          aws ssm get-parameter --name /lab/ci/ssh-private-key --with-decryption --query Parameter.Value --output text > ~/.ssh/id_ed25519 && chmod 0600 ~/.ssh/id_ed25519
          aws ssm get-parameter --name /lab/ci/ssh-public-key --query Parameter.Value --output text > ~/.ssh/id_ed25519.pub && chmod 0600 ~/.ssh/id_ed25519.pub

      - name: Tailnet access and test connectivity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.CI_OAUTH_ID }}
          oauth-secret: ${{ env.CI_OAUTH_SECRET }}
          tags: tag:ci
          ping: 192.168.0.191

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -out tfplan -no-color

      - name: Terraform Apply
        id: apply
        run: terraform apply tfplan -no-color

      - name: Generate VM inventory
        id: generate_vm_inventory
        run: |
          terraform output -json k8s_host_data | jq '{
            k8s_cluster: {
              children: {
                control_plane: {
                  hosts: with_entries(
                    select(.value.role == "control")
                    | .value = { ansible_host: .value.ip }
                  )
                },
                workers: {
                  hosts: with_entries(
                    select(.value.role == "worker")
                    | .value = { ansible_host: .value.ip }
                  )
                }
              }
            }
          }' > ../ansible/inventory/k8s.yaml

      - name: Install external Ansible collections
        run: |
          ansible-galaxy collection install -r ../ansible/requirements.yaml

      - name: Deploy ansible playbooks
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
        run: |
          ansible-playbook playbooks/k8s-cluster-setup.yaml
